name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cada job pide solo lo que usa: los tests no necesitan poder publicar.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # Playwright no es dependencia del proyecto: solo hace falta para estas pruebas.
      - name: Install Playwright and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html 404.html styles.css favicon.svg favicon-32.png favicon-48.png favicon.ico apple-touch-icon.png icon-192.png icon-512.png manifest.json og-image.jpg og-image-es.jpg robots.txt sitemap.xml .nojekyll CNAME site/
          cp -r app js core methodology privacy about guides es fonts img site/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
